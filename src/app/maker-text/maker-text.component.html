<section class="editor-panel" [class.embedded]="embedded" aria-label="Testo del biscotto">
  <header *ngIf="!embedded"><h2>Il tuo messaggio</h2><button mat-icon-button (click)="close()" aria-label="Chiudi" title="Chiudi"><mat-icon>close</mat-icon></button></header>
  <mat-form-field appearance="outline"><mat-label>Prima riga</mat-label><input matInput [disabled]="disabled" [(ngModel)]="message" (ngModelChange)="sendMessage()" maxlength="10" /><mat-hint align="end">{{ message.length }}/10</mat-hint></mat-form-field>
  <mat-form-field *ngIf="inputText2 || message2" appearance="outline"><mat-label>Seconda riga</mat-label><input matInput [disabled]="disabled" [(ngModel)]="message2" (ngModelChange)="sendMessageSecond()" maxlength="10" /><mat-hint align="end">{{ message2.length }}/10</mat-hint></mat-form-field>
  <mat-form-field *ngIf="inputText3 || message3" appearance="outline"><mat-label>Terza riga</mat-label><input matInput [disabled]="disabled" [(ngModel)]="message3" (ngModelChange)="sendMessageThird()" maxlength="10" /><mat-hint align="end">{{ message3.length }}/10</mat-hint></mat-form-field>
  <button *ngIf="!inputText2 && !message2" class="additional-line" mat-button [disabled]="disabled" (click)="inputTextSecond()"><mat-icon>add</mat-icon> Aggiungi riga</button>
  <button *ngIf="(inputText2 || message2) && !inputText3 && !message3" class="additional-line" mat-button [disabled]="disabled" (click)="inputTextThird()"><mat-icon>add</mat-icon> Aggiungi riga</button>
  <mat-form-field appearance="outline"><mat-label>Carattere</mat-label><mat-select [disabled]="disabled" [(ngModel)]="font" (selectionChange)="sendFontMessage()"><mat-select-trigger [style.font-family]="font">{{ font }}</mat-select-trigger><mat-option *ngFor="let family of fontFamilies" [value]="family" [style.font-family]="family">{{ family }}</mat-option></mat-select></mat-form-field>
  <div class="font-size"><span>Dimensione</span><div><button mat-icon-button (click)="decreaseFontSize()" [disabled]="disabled || fontSize <= 30" aria-label="Riduci dimensione" title="Riduci dimensione"><mat-icon>remove</mat-icon></button><output>{{ fontSize }}</output><button mat-icon-button (click)="increaseFontSize()" [disabled]="disabled || fontSize >= 43" aria-label="Aumenta dimensione" title="Aumenta dimensione"><mat-icon>add</mat-icon></button></div></div>
  <fieldset class="swatches"><legend>Colore testo</legend><button *ngFor="let color of colors; let i = index" type="button" class="color-swatch" [disabled]="disabled" [style.background-color]="color" [class.selected]="selectedColor === color" [attr.aria-label]="nameColors[i]" [attr.aria-pressed]="selectedColor === color" [title]="nameColors[i]" (click)="selectedColor = color; sendColorMessage()"></button></fieldset>
  <button *ngIf="!embedded" mat-flat-button color="primary" (click)="close()">Fatto <mat-icon>check</mat-icon></button>
</section>
